[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flutter-workshop-engines"
version = "0.1.0"
description = "Modules I/J: atomic whole-credit trading and hidden incremental auctions"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "sqlmodel>=0.0.24,<0.1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.13,<3", "ruff>=0.11,<1", "uvicorn>=0.34,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
